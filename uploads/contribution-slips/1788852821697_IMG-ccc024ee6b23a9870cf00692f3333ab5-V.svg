<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="600" height="850">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D32F2F" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="850" fill="#F8FAFC" rx="24" />

  <!-- BML Top Header -->
  <rect width="600" height="90" fill="url(#headerGrad)" rx="24" />
  <rect y="70" width="600" height="20" fill="url(#headerGrad)" />
  
  <!-- Bank Logo text -->
  <text x="40" y="52" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="900" letter-spacing="1">BANK OF MALDIVES</text>
  <text x="560" y="52" fill="#FFCDD2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="end">MOBILE BANKING</text>

  <!-- Success Status Card -->
  <g transform="translate(40, 115)">
    <!-- Success Icon Circle -->
    <circle cx="260" cy="40" r="30" fill="#E8F5E9" />
    <circle cx="260" cy="40" r="22" fill="#2E7D32" />
    <path d="M 251 40 L 257 46 L 270 33" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <text x="260" y="94" fill="#1B5E20" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="800" text-anchor="middle">Transfer Successful</text>
    <text x="260" y="116" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" text-anchor="middle">08 Sep 2026, 12:33:42 PM</text>

    <!-- Amount Box -->
    <rect x="20" y="135" width="480" height="85" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="260" y="165" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">TRANSFER AMOUNT</text>
    <text x="260" y="202" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="900" text-anchor="middle">MVR 50.00</text>
  </g>

  <!-- Details Card -->
  <g transform="translate(40, 360)">
    <rect width="520" height="380" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)" />

    <!-- Reference Number -->
    <text x="30" y="45" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600">Reference Number</text>
    <text x="490" y="45" fill="#0F172A" font-family="monospace" font-size="14" font-weight="700" text-anchor="end">BML-TRF-20260908-00692</text>

    <line x1="30" y1="65" x2="490" y2="65" stroke="#F1F5F9" stroke-width="1.5" />

    <!-- Transfer From -->
    <text x="30" y="98" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600">From (Sender)</text>
    <text x="490" y="98" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="end">Aishath Thasleema</text>
    <text x="490" y="118" fill="#94A3B8" font-family="monospace" font-size="12" text-anchor="end">7704******3456</text>

    <line x1="30" y1="135" x2="490" y2="135" stroke="#F1F5F9" stroke-width="1.5" />

    <!-- Transfer To -->
    <text x="30" y="168" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600">To Beneficiary</text>
    <text x="490" y="168" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="end">Action Reconciliation Club</text>
    <text x="490" y="188" fill="#0369A1" font-family="monospace" font-size="12" font-weight="600" text-anchor="end">7730000123456 (ARC Main BML)</text>

    <line x1="30" y1="205" x2="490" y2="205" stroke="#F1F5F9" stroke-width="1.5" />

    <!-- Remarks -->
    <text x="30" y="238" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600">Payment Remarks</text>
    <text x="490" y="238" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="end">ARC-M-006 Sep 2026 Fee</text>

    <line x1="30" y1="260" x2="490" y2="260" stroke="#F1F5F9" stroke-width="1.5" />

    <!-- Transfer Type -->
    <text x="30" y="293" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600">Transfer Type</text>
    <text x="490" y="293" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="end">Internal BML Transfer</text>

    <line x1="30" y1="315" x2="490" y2="315" stroke="#F1F5F9" stroke-width="1.5" />

    <!-- Status -->
    <text x="30" y="348" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600">Status</text>
    <rect x="420" y="330" width="70" height="26" rx="8" fill="#E8F5E9" />
    <text x="455" y="347" fill="#1B5E20" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">COMPLETED</text>
  </g>

  <!-- Official Footer -->
  <g transform="translate(40, 770)">
    <text x="260" y="20" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" text-anchor="middle">This is a computer generated transfer advice and does not require signature.</text>
    <text x="260" y="38" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" text-anchor="middle">Bank of Maldives Plc. | 1444 | www.bankofmaldives.com.mv</text>
  </g>
</svg>